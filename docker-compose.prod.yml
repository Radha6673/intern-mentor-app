services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: skillup-app:latest
    container_name: intern_mentor_app
    restart: unless-stopped
    ports:
      - "8000:80"
      - "8080:80"
      - "${REVERB_PORT:-8085}:8085"
    env_file:
      - .env
    environment:
      APP_ENV: "${APP_ENV:-production}"
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_KEY: "${APP_KEY:-base64:7RCIrcTjU/rWp/7F5nnHtv6YF4sta3SFVbRc6ovWl7c=}"
      APP_URL: "${APP_URL:-http://localhost:8000}"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: "${DB_DATABASE:-intern_mentor}"
      DB_USERNAME: "root"
      DB_PASSWORD: "${DB_PASSWORD:-password}"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      REVERB_SERVER_HOST: "0.0.0.0"
      REVERB_SERVER_PORT: "8085"
      REVERB_APP_ID: "${REVERB_APP_ID:-849102}"
      REVERB_APP_KEY: "${REVERB_APP_KEY:-ab12cd34ef56gh78ij90}"
      REVERB_APP_SECRET: "${REVERB_APP_SECRET:-zy98xw76vu54ts32rq10}"
      REVERB_HOST: "${REVERB_HOST:-localhost}"
      REVERB_PORT: "${REVERB_PORT:-8085}"
      REVERB_SCHEME: "${REVERB_SCHEME:-http}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-204001821509-64dccqtgdcsl88bd7eth3qub1o0l81fe.apps.googleusercontent.com}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-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}"
      GOOGLE_REDIRECT_URI: "${GOOGLE_REDIRECT_URI:-http://localhost:8000/auth/google/callback}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-AQ.Ab8RN6JS6OmwjTwNQ6z0UG5MEqcmjbBg4HNiQYE3wrV6OGbhQA}"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network

  mysql:
    image: mysql:8.4
    container_name: intern_mentor_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_PASSWORD:-password}"
      MYSQL_DATABASE: "${DB_DATABASE:-intern_mentor}"
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "${FORWARD_DB_PORT:-3307}:3306"
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -p${DB_PASSWORD:-password} 2>/dev/null || mysqladmin ping 2>/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:alpine
    container_name: intern_mentor_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "${FORWARD_REDIS_PORT:-6379}:6379"
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  app-network:
    driver: bridge

volumes:
  db_data:
    driver: local
  redis_data:
    driver: local
